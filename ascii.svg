<svg
  xmlns="http://www.w3.org/2000/svg"
  width="553"
  height="511"
  viewBox="0 0 553 511"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">ASCII portrait</title>

  <desc id="desc">
    Portrait rendered locally from a private source photograph
    using a generated ASCII brightness map.
  </desc>

  <style>
    :root {
      --ascii: #1a7f37;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ascii: #3fb950;
      }
    }

    .ascii {
      fill: var(--ascii);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 9px;
      font-weight: 500;
    }
  </style>

  
