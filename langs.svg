<svg
  xmlns="http://www.w3.org/2000/svg"
  width="620"
  height="245"
  viewBox="0 0 620 245"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Programming languages across public repositories
  </title>

  <desc id="desc">
    Language statistics calculated from
    11 public non-fork repositories.
  </desc>

  <style>
    :root {
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --rule: #d0d7de;

      --track: #eaeef2;
      --accent: #1a7f37;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --rule: #30363d;

        --track: #21262d;
        --accent: #3fb950;
      }
    }

    text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .primary {
      fill: var(--text-primary);
    }

    .secondary {
      fill: var(--text-secondary);
    }

    .rule {
      stroke: var(--rule);
    }

    .bar-track {
      fill: var(--track);
    }

    .bar-fill {
      fill: var(--accent);
    }

    .language-name {
      font-size: 11px;
      font-weight: 600;
    }

    .language-value {
      font-size: 8.5px;
    }
  </style>

