  <style>
    :root {
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --rule: #d0d7de;

      --zero: #d8dee4;
      --green-1: #9be9a8;
      --green-2: #40c463;
      --green-3: #30a14e;
      --green-4: #216e39;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --rule: #30363d;

        --zero: #30363d;
        --green-1: #0e4429;
        --green-2: #006d32;
        --green-3: #26a641;
        --green-4: #39d353;
      }
    }

    .primary {
      fill: var(--text-primary);
    }

    .secondary {
      fill: var(--text-secondary);
    }

    .rule {
      stroke: var(--rule);
    }

    .activity-zero {
      fill: var(--zero);
    }

    .activity-1 {
      fill: var(--green-1);
    }

    .activity-2 {
      fill: var(--green-2);
    }

    .activity-3 {
      fill: var(--green-3);
    }

    .activity-4 {
